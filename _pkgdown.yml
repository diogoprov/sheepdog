url: https://provetelab.org/sheepdog/

template:
  bootstrap: 5
  bslib:
    primary: "#241042"

navbar:
  structure:
    left:  [intro, reference, articles, news]
    right: [search, github]

home:
  sidebar:
    structure: [links, license, citation, authors, dev]

reference:
  - title: Stage 1 - Validation data
    desc: Read BirdNET selection tables, select clips for manual review, and cut and pack them.
    contents:
      - extract_validation_clips
      - read_selection_tables
      - select_clips
      - cut_clips
      - pack_clips
  - title: Stage 1 - After the review
    desc: Classify the reviewed clips and summarise precision, thresholds, presence and retraining clips.
    contents:
      - post_validation
      - classify_review
      - precision_by_bin
      - suggest_thresholds
      - nightly_presence
      - retraining_clips
      - plot_precision
      - read_validation_tables
      - build_training_set
      - exclude_training_clips
  - title: Stage 1 - Several reviewers
    desc: Split the clips among reviewers, measure their agreement and combine their verdicts.
    contents:
      - assign_reviewers
      - split_by_reviewer
      - reviewer_agreement
      - consensus_verdicts
  - title: Stage 2 - Calibration
    desc: Calibrate confidence scores into probabilities of true detection and build nightly detection histories.
    contents:
      - calibrate
      - read_validations
      - calibration_models
      - calibration_folds
      - compare_calibration_models
      - select_calibration_model
      - fit_calibration
      - calibration_effort
      - score_detections
      - detection_history
      - summarise_history
      - plot_calibration
  - title: Stage 2 - Bayesian calibration
    desc: Fit the calibration with brms, check the prior and the fit, and propagate the uncertainty to the histories and the matrices.
    contents:
      - calibration_prior
      - prior_predictive_calibration
      - calibration_diagnostics
      - calibration_sensitivity
      - plot_calibration_draws
      - calibration_ppc
      - plot_calibration_ppc
      - history_draws
      - community_matrices_draws
  - title: Stage 3 - Community matrices
    desc: Effort-standardised site x month matrices from calibrated histories.
    contents:
      - build_community_matrices
      - community_matrices
      - cell_status
      - suggest_core_species
  - title: Occupancy models
    desc: Export the occasions, scores, reviewed clips and calibration draws for occupancy models with false positives, such as those of crywolf.
    contents:
      - export_occupancy_data
  - title: Package
    contents:
      - sheepdog-package

articles:
  - title: The three stages
    navbar: The three stages
    contents:
      - sampling-designs
      - articles/reviewing-in-the-gui
      - validation-effort
      - calibration
      - bayesian-calibration
      - community-matrices
  - title: Beyond the three stages
    navbar: Beyond the three stages
    contents:
      - performance
      - retraining
      - migration-3.0.0
      - crywolf-integration
      - frognet-workflow
  - title: 🇧🇷 Em português
    navbar: 🇧🇷 Português
    desc: >
      Traduções de artigos selecionados. A versão em inglês é a referência.
    contents:
      - articles/pt/sheepdog
      - articles/pt/reviewing-in-the-gui
      - articles/pt/sampling-designs
      - articles/pt/frognet-workflow
