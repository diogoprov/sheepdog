<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 500" width="1000" height="500" role="img" aria-labelledby="t d">
<title id="t">What each sampling design of select_clips() sends to review</title>
<desc id="d">The same night of twelve hourly recordings is shown three times. Top keeps the highest-scoring prediction of each recording. Random_detections draws recordings with a detection above the threshold and reviews every detection in them. Random_recordings draws recordings among all, including ones without predictions, and annotates them by ear.</desc>
