# Extended tests (G5.10): the tests that fit Stan models, switched on by
# SHEEPDOG_EXTENDED_TESTS. They take several minutes, so they run weekly
# and on demand, not on every push.
on:
  schedule:
    - cron: "0 6 * * 1"
  workflow_dispatch:

name: Extended tests

permissions:
  contents: read

jobs:
  extended:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    env:
      SHEEPDOG_EXTENDED_TESTS: "true"
      R_KEEP_PKG_SOURCE: yes
    steps:
      - uses: actions/checkout@v4
      - uses: r-lib/actions/setup-r@v2
        with:
          use-public-rspm: true
          extra-repositories: https://diogoprov.r-universe.dev https://stan-dev.r-universe.dev
      - uses: r-lib/actions/setup-r-dependencies@v2
        with:
          extra-packages: any::devtools, any::testthat, any::lme4, any::brms, any::posterior, any::ggplot2
      - name: Run the test suite with the extended tests
        shell: Rscript {0}
        run: |
          devtools::test(stop_on_failure = TRUE,
                         reporter = testthat::ProgressReporter$new(show_praise = FALSE))
