on:
  push:
    branches: [main, master]
  release:
    types: [published]
  workflow_dispatch:

name: pkgdown

permissions:
  contents: write

jobs:
  pkgdown:
    runs-on: ubuntu-latest
    # um runner travado falha em vez de ocupar o job por ate 6 h
    timeout-minutes: 30
    env:
      GITHUB_PAT: ${{ secrets.GITHUB_TOKEN }}
    steps:
      - uses: actions/checkout@v4
      - uses: r-lib/actions/setup-pandoc@v2
      - uses: r-lib/actions/setup-r@v2
        with:
          use-public-rspm: true
      # crywolf (Suggests) nao esta no CRAN e nao e usado nos exemplos nem
      # nas vignettes (eval = FALSE): instala as dependencias fortes mais os
      # Suggests que as vignettes rodam (sem eles os graficos somem do site)
      - uses: r-lib/actions/setup-r-dependencies@v2
        with:
          dependencies: '"hard"'
          extra-packages: any::pkgdown, any::knitr, any::rmarkdown, any::ggplot2, any::lme4, any::vegan, any::ape, any::gllvm, local::.
          needs: website
      - name: Check that the Portuguese translations are up to date
        run: Rscript data-raw/check_translations.R
      - name: Build site
        run: pkgdown::build_site_github_pages(new_process = FALSE, install = FALSE)
        shell: Rscript {0}
      - name: Deploy to GitHub pages
        uses: JamesIves/github-pages-deploy-action@v4
        with:
          clean: false
          branch: gh-pages
          folder: docs
